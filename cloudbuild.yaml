steps:

# ─────────────────────────────────────────────────────────────────────────────
# WAVE 0 — eine unveraenderliche Quellkopie, bevor ein Deploy laeuft.
#
# Bis 2026-09-21 gab es hier zwei Baeume: einen schweren mit torch/transformers
# fuer daily_regime_check und einen leichten ohne. Mit dem Regime-SSO-Retirement
# ist FinBERT aus main.py verschwunden, also faellt die Zweiteilung weg.
#
# Die Historie dazu bleibt als Warnung stehen: torch in ALLE Images zu schieben
# trieb jedes Image von 71 MB auf 2,89 GB (Commit 282beed, 2026-05-10), also
# 45 GB neue Images je Deploy-Welle — das war die Ursache der 272 GB / 16 EUR
# im Artifact Registry. Kommt je wieder eine schwere Abhaengigkeit dazu, muss
# der zweistufige Baum zurueck, bevor sie in requirements.txt landet.
#
# Der Baum wird hier EINMAL geschrieben und danach nie mutiert. Das ist wichtig:
# die Deploy-Wellen unten laufen mit bis zu 6 Steps gleichzeitig gegen dasselbe
# /workspace, ein Umschreiben zwischen den Steps waere ein Rennen.
# ─────────────────────────────────────────────────────────────────────────────

  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'prep-sources'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        rm -rf fn-light
        mkdir -p fn-light

        # main.py hat keine lokalen Modulimporte, main.py + requirements.txt
        # ist daher eine vollstaendige Quelle.
        cp main.py fn-light/main.py
        cp requirements.txt fn-light/requirements.txt
        : > fn-light/.gcloudignore

        # Absichern, dass keine schwere Abhaengigkeit zurueckgekommen ist.
        test -s fn-light/requirements.txt
        test -s fn-light/main.py
        ! grep -qE '^(torch|transformers)' fn-light/requirements.txt
    waitFor: ['-']

# ─────────────────────────────────────────────────────────────────────────────
# WAVE A — first 5 function deploys (run in parallel, no dependency).
#
# Cloud Build has a per-project concurrent-build quota; each `gcloud functions
# deploy` spawns ITS OWN inner Cloud Build to construct the container image.
# When 16 functions were all set to `waitFor: ['-']`, the inner builds queued up,
# and the ones at the back of the queue EXPIRE after ~10 min, failing the
# whole parent build. Splitting deploys into 4 waves (A, B, C1, C2) caps peak
# concurrent inner builds at ~6, which fits comfortably under quota. (See Cloud Build
# failure 2026-05-17T15:35Z that triggered this refactor.)
# ─────────────────────────────────────────────────────────────────────────────

  # Step 1: Deploy the monthly_buy_hfea Function
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-hfea'
    args:
    - functions
    - deploy
    - monthly_buy_hfea
    - --source=fn-light
    - --trigger-http
    - --region=europe-west3
    - --runtime=python310
    - --timeout=540s
    - --entry-point=monthly_buy_hfea
    - --memory=512MB
    - --set-env-vars=GOOGLE_CLOUD_PROJECT=1098661711782,GOOGLE_CLOUD_PROJECT_ID=trading-436516
    waitFor: ['prep-sources']

  # Step 2: Deploy the rebalance_hfea Function
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-rebalance-hfea'
    args:
    - functions
    - deploy
    - rebalance_hfea
    - --source=fn-light
    - --trigger-http
    - --region=europe-west3
    - --runtime=python310
    - --timeout=540s
    - --entry-point=rebalance_hfea
    - --memory=512MB
    - --set-env-vars=GOOGLE_CLOUD_PROJECT=1098661711782,GOOGLE_CLOUD_PROJECT_ID=trading-436516
    waitFor: ['prep-sources']

  # Step 3: Deploy the monthly_buy_spxl Function
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-spxl'
    args:
    - functions
    - deploy
    - monthly_buy_spxl
    - --source=fn-light
    - --trigger-http
    - --region=europe-west3
    - --runtime=python310
    - --timeout=540s
    - --entry-point=monthly_buy_spxl
    - --memory=512MB
    - --set-env-vars=GOOGLE_CLOUD_PROJECT=1098661711782,GOOGLE_CLOUD_PROJECT_ID=trading-436516
    waitFor: ['prep-sources']

  # Step 4: Deploy the monthly_nine_sig_contributions Function
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-orchestrator'
    args:
    - functions
    - deploy
    - monthly_invest_all
    - --source=fn-light
    - --trigger-http
    - --region=europe-west3
    - --runtime=python310
    - --timeout=540s
    - --entry-point=monthly_invest_all
    - --memory=512MB
    - --set-env-vars=GOOGLE_CLOUD_PROJECT=1098661711782,GOOGLE_CLOUD_PROJECT_ID=trading-436516
    waitFor: ['prep-sources']

# ─────────────────────────────────────────────────────────────────────────────
# WAVE B — next 6 function deploys (start after Wave A completes).
# ─────────────────────────────────────────────────────────────────────────────

  # Step 6: Deploy the monthly_dual_momentum Function
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-dm'
    args:
    - functions
    - deploy
    - monthly_dual_momentum
    - --source=fn-light
    - --trigger-http
    - --region=europe-west3
    - --runtime=python310
    - --timeout=540s
    - --entry-point=monthly_dual_momentum
    - --memory=512MB
    - --set-env-vars=GOOGLE_CLOUD_PROJECT=1098661711782,GOOGLE_CLOUD_PROJECT_ID=trading-436516
    waitFor:
      - 'deploy-hfea'
      - 'deploy-rebalance-hfea'
      - 'deploy-spxl'
      - 'deploy-orchestrator'

  # Steps 4e + 4f (monthly_buy_rssb_wtip + rebalance_rssb_wtip) removed 2026-05-12 —
  # RSSB/WTIP strategy discontinued for poor performance. The deployed Cloud Functions
  # and the Cloud Scheduler job will be deleted from GCP separately (see ops cleanup).

  # Step 7: Deploy the quarterly_nine_sig_signal Function
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-spxl-200sma'
    args:
    - functions
    - deploy
    - daily_trade_spxl_200sma
    - --source=fn-light
    - --trigger-http
    - --region=europe-west3
    - --runtime=python310
    - --timeout=540s
    - --entry-point=daily_trade_spxl_200sma
    - --memory=512MB
    - --set-env-vars=GOOGLE_CLOUD_PROJECT=1098661711782,GOOGLE_CLOUD_PROJECT_ID=trading-436516
    waitFor:
      - 'deploy-hfea'
      - 'deploy-rebalance-hfea'
      - 'deploy-spxl'
      - 'deploy-orchestrator'

  # Step 9: Deploy daily_regime_check (SSO/USFR regime detector daily run).
  # Memory bumped to 2GB to fit FinBERT (~440MB at runtime) plus the 500-stock
  # market breadth scan in a single invocation.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-aaa'
    args:
    - functions
    - deploy
    - monthly_buy_aaa
    - --source=fn-light
    - --trigger-http
    - --region=europe-west3
    - --runtime=python310
    - --timeout=540s
    - --entry-point=monthly_buy_aaa
    - --memory=512MB
    - --set-env-vars=GOOGLE_CLOUD_PROJECT=1098661711782,GOOGLE_CLOUD_PROJECT_ID=trading-436516
    waitFor:
      - 'deploy-dm'
      - 'deploy-spxl-200sma'

# ─────────────────────────────────────────────────────────────────────────────
# WAVE C2 — final 2 function deploys (start after Wave C1 completes).
# ─────────────────────────────────────────────────────────────────────────────

  # Step 15: Deploy the unified index_alert Cloud Function with Alpaca and Telegram settings
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-index-alert'
    args:
    - functions
    - deploy
    - index_alert
    - --source=fn-light
    - --trigger-http
    - --region=europe-west3
    - --runtime=python310
    - --timeout=540s
    - --entry-point=index_alert
    - --memory=512MB
    - --set-env-vars=GOOGLE_CLOUD_PROJECT=1098661711782,GOOGLE_CLOUD_PROJECT_ID=trading-436516
    waitFor:
      - 'deploy-aaa'

  # Step 16: Deploy the audit_monthly_run watchdog (verifies the monthly orchestrator actually ran)
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'deploy-audit'
    args:
    - functions
    - deploy
    - audit_monthly_run
    - --source=fn-light
    - --trigger-http
    - --region=europe-west3
    - --runtime=python310
    - --timeout=540s
    - --entry-point=audit_monthly_run_route
    - --memory=512MB
    - --set-env-vars=GOOGLE_CLOUD_PROJECT=1098661711782,GOOGLE_CLOUD_PROJECT_ID=trading-436516
    waitFor:
      - 'deploy-aaa'

# ─────────────────────────────────────────────────────────────────────────────
# WAVE D — Cloud Scheduler (re)creation. Schedulers don't trigger inner Cloud
# Builds, so they can all run in parallel once Wave C is done. Gated on the
# last Wave C step so a scheduler is never created pointing at a function URL
# that hasn't been deployed yet.
# ─────────────────────────────────────────────────────────────────────────────

  # Cloud Scheduler job for 'monthly_invest_all' ORCHESTRATOR (runs all 6 monthly strategies)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud scheduler jobs update http monthly_invest_all \
          --schedule='0 12 1-7 * *' \
          --uri='https://europe-west3-trading-436516.cloudfunctions.net/monthly_invest_all' \
          --http-method='POST' \
          --time-zone='America/New_York' \
          --location='europe-west3' \
          --oidc-service-account-email='1098661711782-compute@developer.gserviceaccount.com' \
        || gcloud scheduler jobs create http monthly_invest_all \
          --schedule='0 12 1-7 * *' \
          --uri='https://europe-west3-trading-436516.cloudfunctions.net/monthly_invest_all' \
          --http-method='POST' \
          --time-zone='America/New_York' \
          --location='europe-west3' \
          --oidc-service-account-email='1098661711782-compute@developer.gserviceaccount.com'
    waitFor:
      - 'deploy-aaa'
      - 'deploy-index-alert'
      - 'deploy-audit'

  # Cloud Scheduler job for 'rebalance_hfea' function
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'scheduler', 'jobs', 'update', 'http', 'rebalance_hfea',
      '--schedule', '0 14 1-7 1,4,7,10 *',
      '--uri', 'https://europe-west3-trading-436516.cloudfunctions.net/rebalance_hfea',
      '--http-method', 'POST',
      '--time-zone', 'America/New_York',
      '--location', 'europe-west3',
      '--oidc-service-account-email', '1098661711782-compute@developer.gserviceaccount.com'
    ]
    waitFor:
      - 'deploy-aaa'
      - 'deploy-index-alert'
      - 'deploy-audit'

  # Cloud Scheduler job 'rebalance_rssb_wtip' removed 2026-05-12 — RSSB/WTIP strategy
  # discontinued. The existing GCP scheduler job has been deleted (cleanup completed 2026-05-17).

  # NOTE: monthly_buy_spxl, monthly_nine_sig_contributions, monthly_buy_hfea, monthly_dual_momentum,
  # and monthly_buy_aaa schedulers are intentionally absent — they have all been
  # REPLACED by the monthly_invest_all orchestrator for coordinated budget management.
  # The individual functions are deployed for manual/debugging use but never directly scheduled.

  # Cloud Scheduler job for 'daily_trade_spxl_200sma' function
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'scheduler', 'jobs', 'update', 'http', 'daily_trade_spxl_200sma',
      '--schedule', '56 15 * * 1-5',
      '--uri', 'https://europe-west3-trading-436516.cloudfunctions.net/daily_trade_spxl_200sma',
      '--http-method', 'POST',
      '--time-zone', 'America/New_York',
      '--location', 'europe-west3',
      '--oidc-service-account-email', '1098661711782-compute@developer.gserviceaccount.com'
    ]
    waitFor:
      - 'deploy-aaa'
      - 'deploy-index-alert'
      - 'deploy-audit'

  # Cloud Scheduler Job for S&P 500 ATH Drop Alert
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud scheduler jobs update http sp500_drop_alert \
          --schedule='30 9-15 * * 1-5' \
          --uri='https://europe-west3-trading-436516.cloudfunctions.net/index_alert' \
          --http-method='POST' \
          --time-zone='America/New_York' \
          --location='europe-west3' \
          --oidc-service-account-email='1098661711782-compute@developer.gserviceaccount.com' \
          --message-body='{"index_symbol": "SPY", "index_name": "S&P 500 (SPY)", "alert_type": "ath_drop", "threshold_percent": 30.0}' \
        || gcloud scheduler jobs create http sp500_drop_alert \
          --schedule='30 9-15 * * 1-5' \
          --uri='https://europe-west3-trading-436516.cloudfunctions.net/index_alert' \
          --http-method='POST' \
          --time-zone='America/New_York' \
          --location='europe-west3' \
          --oidc-service-account-email='1098661711782-compute@developer.gserviceaccount.com' \
          --message-body='{"index_symbol": "SPY", "index_name": "S&P 500 (SPY)", "alert_type": "ath_drop", "threshold_percent": 30.0}'
    waitFor:
      - 'deploy-aaa'
      - 'deploy-index-alert'
      - 'deploy-audit'

  # Cloud Scheduler Job for MSCI World ATH Drop Alert
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'scheduler', 'jobs', 'update', 'http', 'msci_drop_alert',
      '--schedule', '30 9-15 * * 1-5',
      '--uri', 'https://europe-west3-trading-436516.cloudfunctions.net/index_alert',
      '--http-method', 'POST',
      '--time-zone', 'America/New_York',
      '--location', 'europe-west3',
      '--oidc-service-account-email', '1098661711782-compute@developer.gserviceaccount.com',
      '--message-body', '{"index_symbol": "URTH", "index_name": "MSCI World", "alert_type": "ath_drop", "threshold_percent": 30.0}'
    ]
    waitFor:
      - 'deploy-aaa'
      - 'deploy-index-alert'
      - 'deploy-audit'

  # Cloud Scheduler Job for URTH 255-day SMA crossing alert
  # ─────────────────────────────────────────────────────────────────────────
  # RETIRED 2026-09-07: urth_255sma_alert
  #
  # Ersetzt durch world_eur_sma_* am Ende dieser Wave. Der alte Alert mass URTH
  # in USD zu New Yorker Zeiten, die Handelsentscheidung faellt aber in EUR an
  # der XETRA um 17:30 CET - zwei verschiedene Zeitscheiben fuer dieselbe
  # Entscheidung.
  #
  # ACHTUNG: cloudbuild kennt nur create/update. Das Entfernen dieses Blocks
  # loescht den Job NICHT. Einmalig manuell noetig:
  #   gcloud scheduler jobs delete urth_255sma_alert --location=europe-west3
  #
  # msci_drop_alert bleibt bestehen - anderer alert_type (ATH-Drop/Kreditsignal).
  # ─────────────────────────────────────────────────────────────────────────

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud scheduler jobs update http spy_200sma_alert \
          --schedule='15 9-15 * * 1-5' \
          --uri='https://europe-west3-trading-436516.cloudfunctions.net/index_alert' \
          --http-method='POST' \
          --time-zone='America/New_York' \
          --location='europe-west3' \
          --oidc-service-account-email='1098661711782-compute@developer.gserviceaccount.com' \
          --message-body='{"index_symbol": "SPY", "index_name": "S&P 500 (SPY)", "alert_type": "sma_crossing", "sma_period": 200, "noise_threshold": 1.0}' \
        || gcloud scheduler jobs create http spy_200sma_alert \
          --schedule='15 9-15 * * 1-5' \
          --uri='https://europe-west3-trading-436516.cloudfunctions.net/index_alert' \
          --http-method='POST' \
          --time-zone='America/New_York' \
          --location='europe-west3' \
          --oidc-service-account-email='1098661711782-compute@developer.gserviceaccount.com' \
          --message-body='{"index_symbol": "SPY", "index_name": "S&P 500 (SPY)", "alert_type": "sma_crossing", "sma_period": 200, "noise_threshold": 1.0}'
    waitFor:
      - 'deploy-aaa'
      - 'deploy-index-alert'
      - 'deploy-audit'

  # Cloud Scheduler job for the monthly run audit watchdog.
  # Runs once on day 8 of each month at 14:00 ET — after the day-1-7 buy window —
  # so a missed orchestrator run produces a Telegram alert.
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if gcloud scheduler jobs describe audit_monthly_run --location=europe-west3 >/dev/null 2>&1; then
          gcloud scheduler jobs update http audit_monthly_run \
            --schedule='0 14 8 * *' \
            --uri='https://europe-west3-trading-436516.cloudfunctions.net/audit_monthly_run' \
            --http-method='POST' \
            --time-zone='America/New_York' \
            --location='europe-west3' \
            --oidc-service-account-email='1098661711782-compute@developer.gserviceaccount.com'
        else
          gcloud scheduler jobs create http audit_monthly_run \
            --schedule='0 14 8 * *' \
            --uri='https://europe-west3-trading-436516.cloudfunctions.net/audit_monthly_run' \
            --http-method='POST' \
            --time-zone='America/New_York' \
            --location='europe-west3' \
            --oidc-service-account-email='1098661711782-compute@developer.gserviceaccount.com'
        fi
    waitFor:
      - 'deploy-aaa'
      - 'deploy-index-alert'
      - 'deploy-audit'

  # Cloud Scheduler 'daily_regime_world_check' removed 2026-05-12 — Regime World strategy
  # discontinued. The existing GCP scheduler job has been deleted (cleanup completed 2026-05-17).

  # Regime SSO und 9-Sig retired 2026-09-21. Bereinigung bleibt idempotent, damit
  # jeder spaetere Build bestaetigt, dass Functions und Scheduler abwesend bleiben.
  # Reihenfolge: erst die Scheduler loeschen (sonst feuern sie gegen eine tote
  # Function), dann die Functions.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'retire-regime-ninesig-services'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        for JOB in quarterly_nine_sig_signal daily_regime_check; do
          gcloud scheduler jobs delete $$JOB --location=europe-west3 --quiet 2>/dev/null || true
        done
        for FN in monthly_nine_sig_contributions quarterly_nine_sig_signal \
                  daily_regime_check monthly_buy_regime_sso backfill_regime_scores; do
          gcloud functions delete $$FN --region=europe-west3 --quiet 2>/dev/null || true
        done
    waitFor:
      - 'deploy-aaa'
      - 'deploy-index-alert'
      - 'deploy-audit'

  # F4 retired 2026-09-09. Keep this cleanup idempotent so every later build
  # confirms the two obsolete Functions and quarterly scheduler stay absent.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'retire-f4-services'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud scheduler jobs delete quarterly_rebalance_f4 \
          --location=europe-west3 --quiet 2>/dev/null || true
        gcloud functions delete monthly_buy_f4 \
          --region=europe-west3 --quiet 2>/dev/null || true
        gcloud functions delete quarterly_rebalance_f4 \
          --region=europe-west3 --quiet 2>/dev/null || true
    waitFor:
      - 'deploy-aaa'
      - 'deploy-index-alert'
      - 'deploy-audit'


  # ─────────────────────────────────────────────────────────────────────────
  # EUR-SMA-Alerts auf der XETRA-Zeitscheibe (2026-09-07)
  #
  # Ersetzen urth_255sma_alert. Gegatet werden die beiden gehebelten
  # Euro-Produkte (2x ACWI LU3386643970, 2x World) - das Signal laeuft aber auf
  # dem UNGEHEBELTEN 1x-Tracker, so rechnet auch die Studie.
  #
  # Zeitzone Europe/Berlin, NICHT America/New_York wie die aelteren Alerts: der
  # Anker ist der XETRA-Schluss um 17:30, und die Sommerzeitumstellungen der
  # beiden Zonen sind nicht deckungsgleich.
  #
  # Drei Rollen pro Symbol:
  #   advisory  0 15-17  Vorwarnung, schreibt bewusst keinen State
  #   decisive  20 17    Handelsalarm, 10 Min vor Handelsschluss
  #   reconcile 0 21     Abgleich auf den echten Schluss + taeglicher Lebendtest
  # EODHD publiziert EOD-Daten 2-3h nach Boersenschluss; 21:00 Berlin gibt Puffer.
  # Quelle: https://eodhd.com/financial-apis/api-for-historical-data-and-volumes
  #
  # Fenster: ACWI 250d, World 255d. 250d ist fuer den ACWI die gemessene Zahl -
  # nach deutscher Steuer 13,17 % CAGR / Sharpe 0,402 gegen 12,68 % / 0,379 bei
  # 255d (acwi_eur_final.json), und ab 1988 ebenfalls das Optimum des langsamen
  # Plateaus. World behaelt die 255d des ersetzten urth_255sma_alert.
  #
  # Nur der ACWI-decisive-Job traegt public_chat_secret: der Crossing-Alert geht
  # zusaetzlich in einen zweiten Telegram-Kanal (Freunde). Bewusst nur echte
  # Crossings - Vorwarnungen, reconcile-Korrekturen und Datenfehler bleiben im
  # privaten Kanal.
  #
  # Kein neuer Deploy-Schritt: index_alert nimmt den neuen Pfad ueber den
  # source-Parameter, die Function-Liste bleibt unveraendert.
  # ─────────────────────────────────────────────────────────────────────────

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud scheduler jobs update http acwi_eur_sma_advisory \
          --schedule='0 15-17 * * 1-5' \
          --uri='https://europe-west3-trading-436516.cloudfunctions.net/index_alert' \
          --http-method='POST' \
          --time-zone='Europe/Berlin' \
          --location='europe-west3' \
          --oidc-service-account-email='1098661711782-compute@developer.gserviceaccount.com' \
          --message-body='{"index_symbol": "IUSQ.XETRA", "index_name": "MSCI ACWI (EUR)", "alert_type": "sma_crossing", "source": "eodhd", "run_role": "advisory", "sma_period": 250, "noise_threshold": 1.0, "currency_symbol": "€"}' \
        || gcloud scheduler jobs create http acwi_eur_sma_advisory \
          --schedule='0 15-17 * * 1-5' \
          --uri='https://europe-west3-trading-436516.cloudfunctions.net/index_alert' \
          --http-method='POST' \
          --time-zone='Europe/Berlin' \
          --location='europe-west3' \
          --oidc-service-account-email='1098661711782-compute@developer.gserviceaccount.com' \
          --message-body='{"index_symbol": "IUSQ.XETRA", "index_name": "MSCI ACWI (EUR)", "alert_type": "sma_crossing", "source": "eodhd", "run_role": "advisory", "sma_period": 250, "noise_threshold": 1.0, "currency_symbol": "€"}'
    waitFor:
      - 'deploy-aaa'
      - 'deploy-index-alert'
      - 'deploy-audit'

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud scheduler jobs update http acwi_eur_sma_decisive \
          --schedule='20 17 * * 1-5' \
          --uri='https://europe-west3-trading-436516.cloudfunctions.net/index_alert' \
          --http-method='POST' \
          --time-zone='Europe/Berlin' \
